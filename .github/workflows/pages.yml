name: Publish English Structure Lab

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html english_structure_lab.html manifest.webmanifest service-worker.js app-icon-180.png app-icon-512.png _site/
          mkdir -p _site/arabic
          cp arabic/index.html arabic/manifest.webmanifest arabic/service-worker.js arabic/icon.svg _site/arabic/
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
