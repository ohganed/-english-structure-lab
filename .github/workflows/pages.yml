name: Publish English Structure Lab

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html english_structure_lab.html manifest.webmanifest service-worker.js app-icon-180.png app-icon-512.png _site/
          mkdir -p _site/arabic
          cp arabic/index.html arabic/scenes.html arabic/living.html arabic/a1-batch1.js arabic/a1-batch2.js arabic/a1-batch3.js arabic/a1-expansion.js arabic/a1-chapters.js arabic/cefr-curriculum.js arabic/living-expansion.js arabic/a1-analysis.js arabic/a1-grammar.js arabic/grammar-lens.js arabic/a1-dependency.js arabic/dependency-map.js arabic/grammar-depth.js arabic/verb-engine.js arabic/verb-family-map.js arabic/custom-corpus.js arabic/word-audio.js arabic/word-declension.js arabic/verb-conjugation-full.js arabic/course-word-depth.js arabic/sentence-pager.js arabic/library-compat.js arabic/progressive-word.js arabic/course-mode.js arabic/deep-analysis-engine.js arabic/deep-analysis-audited.js arabic/deep-audit-pack2.js arabic/deep-audit-fixes.js arabic/deep-audit-nominals.js arabic/deep-audit-nominal-aliases.js arabic/language-mode.js arabic/manifest.webmanifest arabic/service-worker.js arabic/icon.svg _site/arabic/
          sed -i 's#</body>#<script src="./grammar-lens.js"></script><script src="./a1-dependency.js"></script><script src="./dependency-map.js"></script><script src="./grammar-depth.js"></script><script src="./verb-engine.js"></script><script src="./verb-family-map.js"></script><script src="./living-expansion.js"></script><script src="./language-mode.js"></script></body>#' _site/arabic/living.html
          sed -i 's#</body>#<script src="./custom-corpus.js"></script><script src="./word-audio.js"></script><script src="./sentence-pager.js"></script><script src="./library-compat.js"></script><script src="./progressive-word.js"></script><script src="./deep-analysis-audited.js"></script><script src="./deep-audit-pack2.js"></script><script src="./deep-audit-fixes.js"></script><script src="./deep-audit-nominals.js"></script><script src="./deep-audit-nominal-aliases.js"></script><script src="./word-declension.js"></script><script src="./verb-conjugation-full.js"></script><script src="./course-mode.js"></script><script src="./course-word-depth.js"></script><script src="./deep-analysis-engine.js"></script><script src="./language-mode.js"></script></body>#' _site/arabic/index.html
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
