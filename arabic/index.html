<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ea"><link rel="manifest" href="manifest.webmanifest"><title>Arabic Structure Lab</title><style>
:root{--b:#f5f2ea;--p:#fffdf8;--i:#21302c;--m:#75807c;--l:#ded9ce;--a:#1f6f61;--s:#e7f0ed}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:18px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:750}.brand small{display:block;font-size:10px;color:var(--m)}button{font:inherit}.btn{border:1px solid var(--l);background:#fff;border-radius:14px;padding:9px 12px}.main{margin-top:14px;background:var(--p);border:1px solid var(--l);border-radius:26px;padding:22px;min-height:50vh;box-shadow:0 10px 35px #00000010}.meta{display:flex;justify-content:space-between;color:var(--m);font-size:12px}.arabic{direction:rtl;text-align:right;font-family:"Geeza Pro",serif;font-size:clamp(32px,7vw,50px);line-height:2;padding:18px 0}.word{padding:1px 2px;border-radius:9px}.word.on{background:var(--s)}.tools,.row{display:flex;gap:8px;flex-wrap:wrap}.nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(650px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);background:#fffdf8ee;border:1px solid var(--l);border-radius:20px;padding:6px;backdrop-filter:blur(15px)}.nav button{border:0;background:transparent;padding:10px 4px;color:var(--m)}.sheet,.modal{display:none;position:fixed;z-index:20;background:var(--p)}.sheet{left:0;right:0;bottom:0;max-height:78vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -15px 45px #0003}.sheet.show,.modal.show{display:block}.modal{inset:0;background:var(--b);overflow:auto}.inside{max-width:800px;margin:auto;padding:20px 14px}.head{display:flex;justify-content:space-between;align-items:center}.big{direction:rtl;font:36px/1.6 "Geeza Pro",serif}.voc{direction:rtl;color:var(--a);font:25px/1.6 "Geeza Pro",serif}.meaning{font-weight:700;font-size:18px}.muted{color:var(--m);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.card,.panel{border:1px solid var(--l);border-radius:16px;padding:12px;background:#fff}.label{font-size:10px;color:var(--m);text-transform:uppercase}.ar{direction:rtl;font:23px/1.5 "Geeza Pro",serif}.root{color:var(--a);font-weight:750;border:0;background:none;font-size:18px}.deep{display:none}.deep.show{display:block}.kv{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #eee8dd;font-size:13px}.family{display:flex;overflow:auto;gap:8px}.family>div{min-width:140px;border:1px solid var(--l);border-radius:14px;padding:10px}.chunk{display:block;width:100%;text-align:left;margin:9px 0;border:1px solid var(--l);border-radius:16px;padding:12px;background:#fff}.tree{margin-left:10px;border-left:2px solid #dce7e4;padding-left:12px}.tree button{border:0;background:none;padding:5px 0;text-align:left}.txt{width:100%;min-height:150px;border:1px solid var(--l);border-radius:14px;padding:11px}.txt.arabicIn{direction:rtl;font:21px "Geeza Pro",serif}.toast{position:fixed;z-index:50;left:50%;bottom:95px;transform:translateX(-50%);background:#22332f;color:#fff;padding:8px 13px;border-radius:99px;display:none}.toast.show{display:block}@media(min-width:720px){.sheet{left:50%;width:700px;transform:translateX(-50%)}}
</style></head><body><div class="app"><div class="top"><div class="brand">Arabic Structure Lab<small>Word Anatomy → Meaning Chunks → Sentence Architecture</small></div><button class="btn" id="add">＋ 教材</button></div><main class="main" id="reader"></main></div><nav class="nav"><button data-nav="read">本文</button><button data-nav="chunks">Chunk</button><button data-nav="structure">Structure</button><button data-nav="library">教材</button></nav><section class="sheet" id="wordSheet"><div id="wordBox"></div></section><section class="sheet" id="familySheet"><div id="familyBox"></div></section><div class="modal" id="import"><div class="inside"><div class="head"><h2>教材を追加</h2><button class="btn" data-close="import">×</button></div><div class="panel"><div class="label">Arabic text</div><textarea id="arabicInput" class="txt arabicIn"></textarea><div class="row"><button class="btn" id="copy">文章＋JSON生成プロンプトをコピー</button></div></div><div class="panel"><div class="label">Generated JSON</div><textarea id="jsonInput" class="txt"></textarea><div class="row"><button class="btn" id="load">読み込む</button></div><div id="status" class="muted"></div></div></div></div><div class="modal" id="chunks"><div class="inside"><div class="head"><h2>Meaning Chunks</h2><button class="btn" data-close="chunks">×</button></div><div id="chunkBox"></div></div></div><div class="modal" id="structure"><div class="inside"><div class="head"><h2>Sentence Architecture</h2><button class="btn" data-close="structure">×</button></div><div id="structureBox"></div></div></div><div class="modal" id="library"><div class="inside"><div class="head"><h2>教材</h2><button class="btn" data-close="library">×</button></div><div id="libraryBox"></div></div></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K='asl.library.v1';let L=null,si=0,voc=false;
const P=`Arabic Structure Lab 教材JSON v1.2。次のアラビア語を解析してください。出力は有効なJSONオブジェクトだけ。schemaVersionは\"1.2\"。originalText/sentence.textは原文完全一致、母音記号はvocalizedへ分離。start/endはsentence.text内0始まりend exclusiveでsurface/chunkと一致。分析順は Word Anatomy → Meaning Chunks → Sentence Architecture。wordにはid,surface,vocalized,start,end,meaning{ja,en,ar},lemma,lemmaVocalized,partOfSpeech,root,rootMeaning,pattern,morphemes,morphology,grammar,irab,conjugation,wordFamily,relations,confidenceを可能な限り含める。وبكتابهمのようなsurfaceは一つのwordに保ち、内部を一意ID付きmorphemesへ分解。confidenceはoverallだけでなくlemma/root/vocalization/case/irab等をhigh/medium/low/uncertainで示す。wordFamilyは3〜8語、relationToCurrentWordとlearningPriorityを付ける。chunksにはid,text,vocalized,start,end,wordIds,type,meaningOrder{ja,en},naturalMeaning{ja,en},function{ar,ja,en},headWordId,structureNodeIdを持たせる。meaningOrderはアラビア語語順で理解できる日本語。structureはSVOCを強制せずجملة اسمية/جملة فعليةから判定し、مبتدأ/خبر/فعل/فاعل/مفعول به/جار ومجرور/إضافة/نعت/صلة الموصول等を扱う。tree nodeはid,type,labelAr,labelJa,labelEn,text,refIds,children。إعرابはgrammaticalRole,caseOrMoodArabic,markerArabic,reason,fullIrabAr,explanationJa,explanationEnを可能な限り。word→chunk→structureをID参照で接続。不明・非該当はnull/[]/{}を使い捏造しない。学習者を正解/不正解で採点しない。\n\nINPUT\n{{ARABIC_TEXT}}`;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function s(){return L?.sentences?.[si]||null}function open(id){$('#'+id).classList.add('show')}function close(id){$('#'+id).classList.remove('show')}function toast(x){let t=$('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function validate(d){if(!d?.sentences?.length)throw Error('sentences がありません');for(const x of d.sentences){for(const w of x.words||[])if(Number.isInteger(w.start)&&x.text.slice(w.start,w.end)!==w.surface)throw Error('位置不一致: '+w.surface);for(const c of x.chunks||[])if(Number.isInteger(c.start)&&x.text.slice(c.start,c.end)!==c.text)throw Error('chunk位置不一致: '+c.text)}}
function render(){let x=s(),r=$('#reader');if(!x){r.innerHTML='<div class="muted" style="text-align:center;padding:90px 10px"><b style="color:var(--i);font-size:18px">アラビア語本文から始めます</b><br><br>「＋ 教材」から文章とJSONを入れてください。</div>';return}let ws=[...(x.words||[])].sort((a,b)=>a.start-b.start),h='',p=0;for(const w of ws){h+=esc(x.text.slice(p,w.start))+`<span class="word" data-w="${esc(w.id)}">${esc(voc?(w.vocalized||w.surface):w.surface)}</span>`;p=w.end}h+=esc(x.text.slice(p));r.innerHTML=`<div class="meta"><span>${esc(L.title||'Arabic text')} · ${si+1}/${L.sentences.length}</span><button class="btn" id="speak">▶︎ صوت</button></div><div class="arabic">${h}</div><div class="tools"><button class="btn" id="vocal">母音記号</button><button class="btn" id="meaning">文の意味</button>${L.sentences.length>1?'<button class="btn" id="prev">←</button><button class="btn" id="next">→</button>':''}</div><div id="overall"></div>`;$$('[data-w]').forEach(e=>e.onclick=()=>word(e.dataset.w));$('#vocal').onclick=()=>{voc=!voc;render()};$('#meaning').onclick=()=>$('#overall').innerHTML=`<div class="panel">${esc(x.overallMeaning?.ja||'')}<div class="muted">${esc(x.overallMeaning?.en||'')}</div></div>`;$('#speak').onclick=()=>speak(x.ttsText||x.vocalized||x.text);$('#prev')?.addEventListener('click',()=>{si=Math.max(0,si-1);render()});$('#next')?.addEventListener('click',()=>{si=Math.min(L.sentences.length-1,si+1);render()})}
function word(id){let x=s(),w=x.words.find(z=>z.id===id),root=w.root?`<button class="root" id="root">${esc(w.root)}</button>`:'—';$('#wordBox').innerHTML=`<div class="head"><div><div class="big">${esc(w.surface)}</div><div class="voc">${esc(w.vocalized||'')}</div><div class="meaning">${esc(w.meaning?.ja||'')}</div><div class="muted">${esc(w.meaning?.en||'')}</div></div><button class="btn" id="wc">×</button></div><div class="grid"><div class="card"><div class="label">Lemma</div><div class="ar">${esc(w.lemmaVocalized||w.lemma||'—')}</div></div><div class="card"><div class="label">Root</div>${root}</div></div><button class="btn" id="more">さらに見る</button><div class="deep" id="deep">${details(w)}</div>`;open('wordSheet');$('#wc').onclick=()=>close('wordSheet');$('#more').onclick=()=>$('#deep').classList.toggle('show');$('#root')?.addEventListener('click',()=>family(w));let ids=new Set();(w.relations?.chunkIds||[]).forEach(cid=>{let c=x.chunks?.find(c=>c.id===cid);(c?.wordIds||[]).forEach(i=>ids.add(i))});$$('[data-w]').forEach(e=>e.classList.toggle('on',ids.has(e.dataset.w)))}
function details(w){let h='';if(w.morphemes?.length)h+='<h3>Word Anatomy</h3>'+w.morphemes.map(m=>`<div class="kv"><span>${esc(m.type)}</span><span dir="rtl">${esc(m.vocalized||m.text)}　${esc(m.meaning?.ja||'')}</span></div>`).join('');for(const [name,o] of [['Morphology',w.morphology],['إعراب',w.irab],['Pattern',w.pattern]])if(o&&Object.keys(o).length)h+=`<h3>${name}</h3>`+Object.entries(o).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><span>${esc(typeof v==='object'?JSON.stringify(v):v)}</span></div>`).join('');return h||'<div class="muted">追加分析なし</div>'}
function family(w){$('#familyBox').innerHTML=`<div class="head"><div><div class="label">Root network</div><div class="big">${esc(w.root)}</div><div class="muted">${esc(w.rootMeaning?.ja||'')}</div></div><button class="btn" id="fc">×</button></div><div class="family">${(w.wordFamily||[]).map(f=>`<div><div class="ar">${esc(f.vocalized||f.word)}</div>${esc(f.meaning?.ja||'')}<div class="muted">${esc(f.relationToCurrentWord||'')} · ${esc(f.learningPriority||'')}</div></div>`).join('')||'語族情報なし'}</div>`;close('wordSheet');open('familySheet');$('#fc').onclick=()=>close('familySheet')}
function chunks(){let x=s();$('#chunkBox').innerHTML=(x?.chunks||[]).map(c=>`<button class="chunk" data-c="${esc(c.id)}"><div class="ar">${esc(c.vocalized||c.text)}</div><b>${esc(c.meaningOrder?.ja||'')}</b><div class="muted">${esc(c.naturalMeaning?.ja||'')} · ${esc(c.function?.ja||'')}</div></button>`).join('')||'chunk情報なし';$$('[data-c]').forEach(b=>b.onclick=()=>{let c=x.chunks.find(z=>z.id===b.dataset.c);close('chunks');$$('[data-w]').forEach(e=>e.classList.toggle('on',(c.wordIds||[]).includes(e.dataset.w)));toast(c.meaningOrder?.ja||c.text)})}
function tree(n){if(!n)return'';return `<div class="tree"><button data-node="${esc(n.id||'')}">${esc(n.labelJa||n.labelEn||n.type||'')} <span dir="rtl">${esc(n.text||'')}</span></button>${(n.children||[]).map(tree).join('')}</div>`}function structure(){let x=s(),t=x?.structure?.tree;$('#structureBox').innerHTML=`<div class="panel"><div class="ar">${esc(x?.sentenceType?.ar||x?.structure?.sentenceClass||'')}</div>${esc(x?.sentenceType?.ja||'')}</div><div class="panel">${tree(t)}</div>`;$$('[data-node]').forEach(b=>b.onclick=()=>{let n=find(t,b.dataset.node),ids=new Set(n?.refIds||[]);close('structure');$$('[data-w]').forEach(e=>e.classList.toggle('on',ids.has(e.dataset.w)));toast(n?.labelJa||'構造')})}function find(n,id){if(!n)return null;if(n.id===id)return n;for(const c of n.children||[]){let f=find(c,id);if(f)return f}}
function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.82;speechSynthesis.speak(u)}function save(d){let a=JSON.parse(localStorage.getItem(K)||'[]'),key=d.originalText||d.title||Date.now();a=[{key,title:d.title||'Arabic text',d},...a.filter(x=>x.key!==key)].slice(0,30);localStorage.setItem(K,JSON.stringify(a))}function lib(){let a=JSON.parse(localStorage.getItem(K)||'[]');$('#libraryBox').innerHTML=a.map((x,i)=>`<button class="chunk" data-lib="${i}"><b>${esc(x.title)}</b></button>`).join('')||'保存教材なし';$$('[data-lib]').forEach(b=>b.onclick=()=>{L=a[+b.dataset.lib].d;si=0;render();close('library')})}
$('#add').onclick=()=>open('import');$$('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$('#copy').onclick=async()=>{await navigator.clipboard.writeText(P.replace('{{ARABIC_TEXT}}',$('#arabicInput').value.trim()));toast('コピーしました')};$('#load').onclick=()=>{try{let q=$('#jsonInput').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');q=q.slice(q.indexOf('{'),q.lastIndexOf('}')+1);let d=JSON.parse(q);validate(d);L=d;si=0;save(d);render();close('import');toast('読み込みました')}catch(e){$('#status').textContent=e.message}};$$('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='chunks'){chunks();open('chunks')}if(b.dataset.nav==='structure'){structure();open('structure')}if(b.dataset.nav==='library'){lib();open('library')}});try{let a=JSON.parse(localStorage.getItem(K)||'[]');L=a[0]?.d||null}catch{}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
