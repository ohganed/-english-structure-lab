</style></head><body><div class="app"><div class="top"><div class="brand">Arabic Structure Lab<small>Word Anatomy → Meaning Chunks → Sentence Architecture</small></div><button class="btn" id="add">＋ Add</button></div><main class="main" id="reader"></main></div><nav class="nav"><button data-nav="read">Text</button><button data-nav="chunks">Chunks</button><button data-nav="structure">Structure</button><button data-nav="library">Library</button></nav><section class="sheet" id="wordSheet"><div id="wordBox"></div></section><section class="sheet" id="familySheet"><div id="familyBox"></div></section><div class="modal" id="import"><div class="inside"><div class="head"><h2>Add lesson</h2><button class="btn" data-close="import">×</button></div><div class="panel"><div class="label">Arabic text</div><textarea id="arabicInput" class="txt arabicIn"></textarea><div class="row"><button class="btn" id="copy">Copy text + JSON prompt</button></div></div><div class="panel"><div class="label">Generated JSON</div><textarea id="jsonInput" class="txt"></textarea><div class="row"><button class="btn" id="load">Load lesson</button></div><div id="status" class="muted"></div></div></div></div><div class="modal" id="chunks"><div class="inside"><div class="head"><h2>Meaning Chunks</h2><button class="btn" data-close="chunks">×</button></div><div id="chunkBox"></div></div></div><div class="modal" id="structure"><div class="inside"><div class="head"><h2>Sentence Architecture</h2><button class="btn" data-close="structure">×</button></div><div id="structureBox"></div></div></div><div class="modal" id="library"><div class="inside"><div class="head"><h2>Library</h2><button class="btn" data-close="library">×</button></div><div id="libraryBox"></div></div></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K='asl.library.v1';let L=null,si=0,voc=false;
const P=`Arabic Structure Lab — 教材JSON生成プロンプト v1.2

あなたは現代標準アラビア語（MSA）、アラビア語形態論、語根・語型論、統語論、إعراب、外国語としてのアラビア語教育の専門家です。入力されたアラビア語文章を、日本人学習者向けArabic Structure Lab教材JSONへ変換してください。

【最優先】出力は有効なJSONオブジェクトだけ。Markdownコードフェンス・前置き・後書きは禁止。schemaVersionは"1.2"。originalTextとsentence.textは原文完全一致。原文にない母音記号はここへ追加せず、vocalized/vocalizedTextへ分離する。全文を処理する。start/endは各sentence.text内の0始まり・end exclusiveで、sentence.text[start:end]===surface、chunkも同様。

分析順序は必ず 1) Word Anatomy 2) Meaning Chunks 3) Sentence Architecture。画面では本文が主役で、詳細は段階開示できるデータ構造にする。

各wordは可能な限り id,surface,vocalized,pauseForm,connectedForm,ttsText,start,end,meaning{ja,en,ar},lemma,lemmaVocalized,partOfSpeech{ar,en,ja},root,rootMeaning,pattern,morphemes,morphology,grammar,irab,conjugation,wordFamily,display,revealSequence,relations,explanation,confidence,confidenceReason,alternativeAnalysis を持つ。

Surface tokenとmorphemeを区別する。وبكتابهم のようなsurfaceは一つのwordとして保存し、内部を و / ب / كتاب / هم に分解する。各morphemeには必ず一意IDを与え、可能ならtext,vocalized,type,meaning,function,grammaticalRole,refIds,confidenceを持たせる。

confidenceはoverallだけでなく meaning,lemma,root,pattern,vocalization,morphology,case,irab など項目別に high/medium/low/uncertain で示す。不確実な分析は断定せずalternativeAnalysisとreasonを使う。

wordのdisplay推奨: default=[vocalized,meaning,lemma,root], expanded=[morphology,pattern,morphemes,grammar,irab], deep=[conjugation,detailedIrab,wordFamily,alternativeAnalysis]。revealSequenceは意味→lemma→root→形態→إعراب→wordFamilyの順を基本に、品詞に応じて不要項目を除く。

動詞lemmaは基本的に完了形3人称男性単数。動詞はForm、完了/未完了/命令、法、態、人称、数、性などを示す。名詞・形容詞はgender,number,definiteness,case,caseEnding,declensionType,state,agreementを可能な限り示す。語根は無理に作らない。wordFamilyは現代語として有用な3〜8語を目安にrelationToCurrentWordとlearningPriorityを付ける。

chunksは意味のまとまりで、id,text,vocalized,start,end,wordIds,type,meaningOrder{ja,en},naturalMeaning{ja,en},function{ar,ja,en},headWordId,modifies,structureNodeId,noteを持つ。meaningOrderはアラビア語語順を保った理解で、意味不明な逐語訳にはしない。إضافة、صفة、関係節、جار ومجرور等を適切にまとめる。

structureは英語SVOCを強制せず、جملة اسمية / جملة فعلية等から判定し、مبتدأ,خبر,فعل,فاعل,نائب فاعل,مفعول به,حال,تمييز,نعت,بدل,عطف,مضاف,مضاف إليه,جار ومجرور,ظرف,صلة الموصول,اسم إنّ,خبر إنّ,اسم كان,خبر كان等を認識する。各要素にtermAr,termEn,termJaを可能な限り持たせる。

إعرابはgrammaticalRole,caseOrMood,caseOrMoodArabic,marker,markerArabic,reason,fullIrabAr,explanationJa,explanationEnを可能な限り示す。مبني/معرب、隠れた主語implicitSubject、接尾代名詞、علامة الإعرابも扱う。

structure.treeは教育用で、各nodeにid,type,labelAr,labelJa,labelEn,text,refIds,childrenを持たせる。word→chunk→structureをIDで相互参照し、単語タップで所属chunkとtree nodeへ、chunkタップで構成wordへ、structure nodeタップで本文へ移れるようにする。

音声用に文・chunk・wordへttsText/vocalized,pauseForm,connectedFormを必要に応じて持たせる。

該当しない単一値はnull、複数値は[]、不要objectは{}を優先し、埋めるための捏造をしない。

学習者を採点しない。正解/不正解/惜しい/間違い/覚えましょう/暗記してください/できましたか等の思想を避ける。

最終確認: JSON parse可能、原文不変、全文処理、start/end一致、母音記号分離、語根/語型の捏造なし、إعراب整合、chunk過分割なし、語順理解と自然訳を区別、隠れた主語/接尾代名詞/إضافة/صفة/関係節を確認、field-level confidence、morpheme ID、word→chunk→structure参照、progressive disclosure対応。

INPUT
以下のアラビア語文章を分析してください。

const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const stripHarakat=t=>String(t??'').replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g,'');
function s(){return L?.sentences?.[si]||null}function open(id){$('#'+id).classList.add('show')}function close(id){$('#'+id).classList.remove('show')}function toast(x){let t=$('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function validate(d){if(!d?.sentences?.length)throw Error('No sentences found.');for(const x of d.sentences){for(const w of x.words||[])if(Number.isInteger(w.start)&&x.text.slice(w.start,w.end)!==w.surface)throw Error('Position mismatch: '+w.surface);for(const c of x.chunks||[])if(Number.isInteger(c.start)&&x.text.slice(c.start,c.end)!==c.text)throw Error('Chunk position mismatch: '+c.text)}}
function render(){let x=s(),r=$('#reader');if(!x){r.innerHTML='<div class="muted" style="text-align:center;padding:90px 10px"><b style="color:var(--i);font-size:18px">Start with an Arabic text</b><br><br>Tap “＋ Add” to import a lesson.</div>';return}let ws=[...(x.words||[])].sort((a,b)=>a.start-b.start),h='',p=0;for(const w of ws){h+=esc(stripHarakat(x.text.slice(p,w.start)));let shown=voc?(w.vocalized||w.surface):stripHarakat(w.surface);h+=`<span class="word" data-w="${esc(w.id)}">${esc(shown)}</span>`;p=w.end}h+=esc(stripHarakat(x.text.slice(p)));r.innerHTML=`<div class="meta"><span>${esc(L.title||'Arabic text')} · ${si+1}/${L.sentences.length}</span><button class="btn" id="speak">▶︎ Audio</button></div><div class="arabic">${h}</div><div class="tools"><button class="btn ${voc?'on':''}" id="vocal">${voc?'Vowels On':'Vowels'}</button><button class="btn" id="meaning">Meaning</button>${L.sentences.length>1?'<button class="btn" id="prev">←</button><button class="btn" id="next">→</button>':''}</div><div id="overall"></div>`;$$('[data-w]').forEach(e=>e.onclick=()=>word(e.dataset.w));$('#vocal').onclick=()=>{voc=!voc;render()};$('#meaning').onclick=()=>$('#overall').innerHTML=`<div class="panel"><div class="meaningEn">${esc(x.overallMeaning?.en||x.overallMeaning?.ja||'')}</div><div class="meaningJa">${esc(x.overallMeaning?.ja||'')}</div></div>`;$('#speak').onclick=()=>speak(x.ttsText||x.vocalized||x.text);$('#prev')?.addEventListener('click',()=>{si=Math.max(0,si-1);render()});$('#next')?.addEventListener('click',()=>{si=Math.min(L.sentences.length-1,si+1);render()})}
function word(id){let x=s(),w=x.words.find(z=>z.id===id),root=w.root?`<button class="root" id="root">${esc(w.root)}</button>`:'—';$('#wordBox').innerHTML=`<div class="head"><div><div class="big">${esc(w.surface)}</div><div class="voc">${esc(w.vocalized||'')}</div><div class="meaningEn">${esc(w.meaning?.en||w.meaning?.ja||'')}</div><div class="meaningJa">${esc(w.meaning?.ja||'')}</div></div><button class="btn" id="wc">×</button></div><div class="row" style="margin-top:10px"><button class="btn" id="wordSpeak">▶︎ Audio</button></div><div class="grid"><div class="card"><div class="label">Lemma</div><div class="ar">${esc(w.lemmaVocalized||w.lemma||'—')}</div></div><div class="card"><div class="label">Root</div>${root}</div></div><button class="btn" id="more">More</button><div class="deep" id="deep">${details(w)}</div>`;open('wordSheet');$('#wc').onclick=()=>close('wordSheet');$('#wordSpeak').onclick=()=>speak(w.ttsText||w.vocalized||w.surface);$('#more').onclick=()=>$('#deep').classList.toggle('show');$('#root')?.addEventListener('click',()=>family(w));let ids=new Set();(w.relations?.chunkIds||[]).forEach(cid=>{let c=x.chunks?.find(c=>c.id===cid);(c?.wordIds||[]).forEach(i=>ids.add(i))});$$('[data-w]').forEach(e=>e.classList.toggle('on',ids.has(e.dataset.w)))}
function details(w){let h='';if(w.partOfSpeech)h+=`<div class="kv"><span>Part of speech</span><span>${esc(w.partOfSpeech.en||w.partOfSpeech.ar||'')}<span class="jaSub">${esc(w.partOfSpeech.ja||'')}</span></span></div>`;if(w.morphemes?.length)h+='<h3>Word Anatomy</h3>'+w.morphemes.map(m=>`<div class="kv"><span>${esc(m.type||'Morpheme')}</span><span><span dir="rtl">${esc(m.vocalized||m.text)}</span> — ${esc(m.meaning?.en||'')}<span class="jaSub">${esc(m.meaning?.ja||'')}</span></span></div>`).join('');for(const [name,o] of [['Morphology',w.morphology],['Pattern',w.pattern]])if(o&&Object.keys(o).length)h+=`<h3>${name}</h3>`+Object.entries(o).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><span>${esc(typeof v==='object'?JSON.stringify(v):v)}</span></div>`).join('');if(w.irab&&Object.keys(w.irab).length)h+=`<h3>إعراب <small class="muted">Iʿrāb</small></h3><div class="kv"><span>Role</span><span>${esc(w.irab.grammaticalRole||'')}</span></div><div class="kv"><span>Case / mood</span><span>${esc(w.irab.caseOrMood||w.irab.caseOrMoodArabic||'')}</span></div><div class="kv"><span>Marker</span><span>${esc(w.irab.marker||w.irab.markerArabic||'')}</span></div><div class="kv"><span>Explanation</span><span>${esc(w.irab.explanationEn||w.irab.reason||'')}<span class="jaSub">${esc(w.irab.explanationJa||'')}</span></span></div>`;if(w.explanation?.en||w.explanation?.ja)h+=`<h3>Note</h3><div>${esc(w.explanation?.en||'')}<div class="jaSub">${esc(w.explanation?.ja||'')}</div></div>`;return h||'<div class="muted">No additional analysis.</div>'}
function family(w){$('#familyBox').innerHTML=`<div class="head"><div><div class="label">Root network</div><div class="big">${esc(w.root)}</div><div>${esc(w.rootMeaning?.en||'')}</div><div class="jaSub">${esc(w.rootMeaning?.ja||'')}</div></div><button class="btn" id="fc">×</button></div><div class="family">${(w.wordFamily||[]).map(f=>`<div><div class="ar">${esc(f.vocalized||f.word)}</div><b>${esc(f.meaning?.en||f.meaning||'')}</b><div class="jaSub">${esc(f.meaning?.ja||'')}</div><div class="muted">${esc(f.relationToCurrentWord||'')} · ${esc(f.learningPriority||'')}</div></div>`).join('')||'No word-family data.'}</div>`;close('wordSheet');open('familySheet');$('#fc').onclick=()=>close('familySheet')}
function chunks(){let x=s();$('#chunkBox').innerHTML=(x?.chunks||[]).map(c=>`<button class="chunk" data-c="${esc(c.id)}"><div class="ar">${esc(c.vocalized||c.text)}</div><div class="primary">${esc(c.meaningOrder?.en||c.naturalMeaning?.en||'')}</div><div class="jaSub">${esc(c.meaningOrder?.ja||c.naturalMeaning?.ja||'')}</div><div class="muted" style="margin-top:6px">${esc(c.function?.en||c.type||'')}<span class="jaSub">${esc(c.function?.ja||'')}</span></div></button>`).join('')||'No chunk data.';$$('[data-c]').forEach(b=>b.onclick=()=>{let c=x.chunks.find(z=>z.id===b.dataset.c);close('chunks');$$('[data-w]').forEach(e=>e.classList.toggle('on',(c.wordIds||[]).includes(e.dataset.w)));toast(c.meaningOrder?.en||c.naturalMeaning?.en||c.text)})}
function tree(n){if(!n)return'';return `<div class="tree"><button data-node="${esc(n.id||'')}"><b>${esc(n.labelEn||n.type||n.labelAr||'')}</b> <span dir="rtl">${esc(n.text||'')}</span><span class="jaSub">${esc(n.labelJa||'')}</span></button>${(n.children||[]).map(tree).join('')}</div>`}function structure(){let x=s(),t=x?.structure?.tree;$('#structureBox').innerHTML=`<div class="panel"><div class="ar">${esc(x?.sentenceType?.ar||x?.structure?.sentenceClass||'')}</div><div class="meaningEn">${esc(x?.sentenceType?.en||'')}</div><div class="jaSub">${esc(x?.sentenceType?.ja||'')}</div></div><div class="panel">${tree(t)}</div>`;$$('[data-node]').forEach(b=>b.onclick=()=>{let n=find(t,b.dataset.node),ids=new Set(n?.refIds||[]);close('structure');$$('[data-w]').forEach(e=>e.classList.toggle('on',ids.has(e.dataset.w)));toast(n?.labelEn||n?.labelAr||'Structure')})}function find(n,id){if(!n)return null;if(n.id===id)return n;for(const c of n.children||[]){let f=find(c,id);if(f)return f}}
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.82;speechSynthesis.speak(u)}function save(d){let a=JSON.parse(localStorage.getItem(K)||'[]'),key=d.originalText||d.title||Date.now();a=[{key,title:d.title||'Arabic text',d},...a.filter(x=>x.key!==key)].slice(0,30);localStorage.setItem(K,JSON.stringify(a))}function lib(){let a=JSON.parse(localStorage.getItem(K)||'[]');$('#libraryBox').innerHTML=a.map((x,i)=>`<button class="chunk" data-lib="${i}"><b>${esc(x.title)}</b></button>`).join('')||'No saved lessons.';$$('[data-lib]').forEach(b=>b.onclick=()=>{L=a[+b.dataset.lib].d;si=0;render();close('library')})}
$('#add').onclick=()=>open('import');$$('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$('#copy').onclick=async()=>{await navigator.clipboard.writeText(P.replace('{{ARABIC_TEXT}}',$('#arabicInput').value.trim()));toast('Copied')};$('#load').onclick=()=>{try{let q=$('#jsonInput').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');q=q.slice(q.indexOf('{'),q.lastIndexOf('}')+1);let d=JSON.parse(q);validate(d);L=d;si=0;save(d);render();close('import');toast('Lesson loaded')}catch(e){$('#status').textContent=e.message}};$$('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='chunks'){chunks();open('chunks')}if(b.dataset.nav==='structure'){structure();open('structure')}if(b.dataset.nav==='library'){lib();open('library')}});try{let a=JSON.parse(localStorage.getItem(K)||'[]');L=a[0]?.d||null}catch{}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
