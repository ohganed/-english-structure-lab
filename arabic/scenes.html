<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ea"><title>Arabic Structure Lab · Living Scenes</title><style>
:root{--bg:#f5f2ea;--paper:#fffdf8;--ink:#1e2a28;--muted:#73807c;--line:#ded9ce;--accent:#1f6f61;--soft:#e6f0ed;--chip:#ede9df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:750}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.btn,.pill{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 13px;color:var(--ink);font:inherit}.pill{border:0;background:var(--chip);border-radius:999px}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.strip{display:flex;gap:7px;overflow:auto;padding:16px 0 10px}.sceneBtn{min-width:48px;height:44px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:22px}.sceneBtn.on{background:var(--soft);border-color:#bad4cc}.progress{text-align:center;color:var(--muted);font-size:11px;margin:4px 0 10px}.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:22px 17px;min-height:350px;display:flex;flex-direction:column;justify-content:center}.emoji{text-align:center;font-size:clamp(40px,12vw,68px);line-height:1.55;letter-spacing:.04em}.feel{text-align:center;font-size:18px;font-weight:700;margin-top:14px}.caption{text-align:center;color:var(--muted);font-size:12px;margin-top:7px}.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}.word{border:1px solid var(--line);background:#fff;border-radius:18px;padding:12px;text-align:center}.word .icon{font-size:25px}.word .ar{font-family:"Geeza Pro","Noto Naskh Arabic",serif;direction:rtl;font-size:27px;margin-top:4px}.word .m{font-size:12px;color:var(--muted);margin-top:3px}.utter{font-family:"Geeza Pro","Noto Naskh Arabic",serif;direction:rtl;text-align:center;font-size:36px;line-height:1.7;margin:14px 0}.meaning{text-align:center;color:var(--muted);min-height:20px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.note{background:#f8f6f0;border-radius:16px;padding:11px 13px;font-size:12px;color:var(--muted);margin-top:12px}.writing{position:relative;height:235px;border:1px solid var(--line);background:#fff;border-radius:22px;overflow:hidden;margin-top:14px}.target{position:absolute;inset:0;display:grid;place-items:center;font:82px "Geeza Pro","Noto Naskh Arabic",serif;direction:rtl;color:rgba(31,111,97,.14);pointer-events:none}.target.hide{opacity:0}.writing canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.bottom{display:flex;justify-content:center;gap:8px;margin-top:14px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;text-align:center}.backlink{text-decoration:none}
</style></head><body><div class="app"><div class="top"><div class="brand">Arabic Structure Lab<small>Living Scenes · Mental Scene First</small></div><a class="btn backlink" href="./index.html">本文へ</a></div><div class="strip" id="strip"></div><div class="progress" id="progress"></div><main class="card" id="card"></main><div class="bottom" id="bottom"></div></div><script>
const S=[
{e:'👀 → 🙂 → 👋',f:'🙂 会えてうれしい・声をかけたい',c:'人に会った。まず相手へ意識が向く。',w:[['👋','مَرْحَبًا','こんにちは'],['🙂','أَهْلًا','やあ／ようこそ']],u:'مَرْحَبًا!',m:'こんにちは！',x:'مَرْحَبًا',z:'🙂 ↔ 🙂　相手も笑顔で返してくれる。'},
{e:'👤 → ❓ → 🙂',f:'🤔 相手を知りたい',c:'話している相手の名前をまだ知らない。',w:[['👤','اِسْم','名前'],['👉','أَنْتَ','あなた'],['🙋','أَنَا','私']],u:'مَا اسْمُكَ؟',m:'お名前は？',x:'اِسْم',z:'🙂 「عَلِيّ」— 相手が名前を教えてくれる。'},
{e:'☀️ → 🚶 → 🥵 → 💧👀',f:'🥵 喉が渇いた・飲みたい',c:'暑い中を歩いた。水が必要になる。',w:[['💧','مَاء','水'],['🥵','عَطْشَان','喉が渇いた'],['🤲','أُرِيدُ','私は欲しい'],['🥤','أَشْرَبُ','私は飲む']],u:'أُرِيدُ مَاءً.',m:'水が欲しい。',x:'مَاء',z:'🥤 → 🙂　水を受け取り、喉の渇きがおさまる。'},
{e:'📱✅  🔑✅  👛❌ → 😧 → 🔍',f:'😧 焦る・探したい',c:'出かけようとしたら財布がない。',w:[['❓','أَيْنَ','どこ'],['👛','مِحْفَظَة','財布'],['👇','هُنَا','ここ'],['👉','هُنَاكَ','あそこ']],u:'أَيْنَ مِحْفَظَتِي؟',m:'私の財布はどこ？',x:'مِحْفَظَة',z:'👩👉🛋️ → 😮 → 😊　教えてもらい、見つかる。'},
{e:'🍽️ → 👀 → 😋 → 👉🍲',f:'😋 食べたい・これを選びたい',c:'メニューを見て、食べたいものを見つけた。',w:[['👉','هَذَا','これ'],['🤲','أُرِيدُ','私は欲しい'],['🍲','طَعَام','食べ物'],['🙏','مِنْ فَضْلِكَ','お願いします']],u:'أُرِيدُ هَذَا، مِنْ فَضْلِكَ.',m:'これをお願いします。',x:'هَذَا',z:'🍲 → 🙂　注文したものが運ばれてくる。'},
{e:'🌙 → 😴 → ⏰😳 → 🚌💨 → 😱',f:'😱 まずい・遅れた',c:'寝坊して、バスが行ってしまった。',w:[['⏰','سَاعَة','時計／時刻'],['🚌','حَافِلَة','バス'],['😱','تَأَخَّرَ','遅れた'],['🏃','سَرِيعًا','急いで']],u:'تَأَخَّرْتُ!',m:'遅れた！',x:'حَافِلَة',z:'📱 → 😟　待っている人へ事情を伝える必要が生まれる。'},
{e:'🏨 → 🚪 → 🔒 → 😕',f:'😕 入りたいのに入れない',c:'ドアが開かない。部屋へ入りたい。',w:[['🚪','بَاب','ドア'],['🔑','مِفْتَاح','鍵'],['➡️','دُخُول','入ること'],['🙅','لَا أَسْتَطِيعُ','私はできない']],u:'لَا أَسْتَطِيعُ الدُّخُولَ.',m:'中に入れません。',x:'مِفْتَاح',z:'🧑‍💼🔑 → 🚪✅　助けてもらい、ドアが開く。'},
{e:'🤒 → 🏠 → 📱',f:'🤒 具合が悪い・知らせたい',c:'今日は外へ出るのがつらい。相手へ伝える。',w:[['🤒','مَرِيض','病気の'],['😫','تَعْبَان','疲れた／具合が悪い'],['🏠','بَيْت','家'],['📅','الْيَوْم','今日']],u:'أَنَا مَرِيضٌ الْيَوْمَ.',m:'今日は具合が悪いです。',x:'مَرِيض',z:'📱🙂　相手が事情を理解し、休めることになる。'},
{e:'🎁 → 😮 → 😊 → 🙏',f:'😊 うれしい・感謝を伝えたい',c:'思いがけず贈り物をもらった。',w:[['🎁','هَدِيَّة','贈り物'],['✨','جَمِيل','美しい／すてき'],['🙏','شُكْرًا','ありがとう'],['💛','جَزِيلًا','大いに']],u:'شُكْرًا جَزِيلًا!',m:'本当にありがとう！',x:'شُكْرًا',z:'😊 ↔ 😊　感謝が伝わり、相手もうれしくなる。'},
{e:'🌙 → 🥱 → 👋 → 🚪',f:'😌 今日はここまで・また会いたい',c:'一日が終わり、相手と別れる。',w:[['🌙','مَسَاء','夕方／夜'],['👋','لِقَاء','会うこと'],['📅','غَدًا','明日'],['🙂','إِلَى','〜まで／〜へ']],u:'إِلَى اللِّقَاءِ.',m:'また会いましょう。',x:'لِقَاء',z:'👋🙂　別れても、次に会うことが前提として残る。'}];
let i=0,step=0,ctx,drawing=false,last=null;const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function buzz(){if(navigator.vibrate)navigator.vibrate(12)}function speak(t){if(!t)return;if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.78;u.onstart=buzz;u.onboundary=buzz;speechSynthesis.speak(u)}
function names(n){return['Situation','Feeling / Need','Sound World','Arabic emerges','Writing','Consequence'][n]}
function render(){let s=S[i];$('#strip').innerHTML=S.map((x,n)=>`<button class="sceneBtn ${n===i?'on':''}" data-i="${n}">${x.e.split(' ')[0]}</button>`).join('');$('#progress').textContent=`Scene ${i+1}/10 · ${names(step)}`;let h='';
if(step===0)h=`<div class="emoji">${s.e}</div><div class="caption">まず頭の中に状況を作ります。まだ言葉を急ぎません。</div>`;
if(step===1)h=`<div class="emoji">${s.e}</div><div class="feel">${s.f}</div><div class="caption">${s.c}</div>`;
if(step===2)h=`<div class="emoji" style="font-size:40px">${s.e}</div><div class="words">${s.w.map((w,n)=>`<button class="word" data-w="${n}"><div class="icon">${w[0]}</div><div class="ar">${w[1]}</div><div class="m">▶︎ ${w[2]}</div></button>`).join('')}</div><div class="note">単語帳ではなく、この場面に今存在している言葉です。触ると発音します。</div>`;
if(step===3)h=`<div class="emoji" style="font-size:42px">${s.e}</div><div class="actions"><button class="pill primary" id="hear">▶︎ まず聞く</button></div><div class="utter">${s.u}</div><div class="actions"><button class="pill" id="meaningBtn">意味を確認</button></div><div class="meaning" id="meaning"></div>`;
if(step===4)h=`<div class="label">Writing · イメージ → 音 → 文字</div><div class="utter" style="font-size:30px">${s.x}</div><div class="writing"><div class="target" id="target">${s.x}</div><canvas id="canvas"></canvas></div><div class="actions"><button class="pill" id="hearWrite">▶︎ 発音</button><button class="pill" id="trace">見本を隠す</button><button class="pill" id="clear">消す</button></div>`;
if(step===5)h=`<div class="emoji">${s.z.split('　')[0]}</div><div class="feel">${s.z}</div><div class="caption">言葉を使った結果、状況が変わります。</div><div class="actions"><button class="pill primary" id="again">最初からもう一度</button><button class="pill" id="finalHear">▶︎ 発話を聞く</button></div>`;
$('#card').innerHTML=h;$('#bottom').innerHTML=`${step>0?'<button class="pill" id="back">← 戻る</button>':''}${step<5?'<button class="pill primary" id="next">次へ →</button>':''}`;$$('[data-i]').forEach(b=>b.onclick=()=>{i=+b.dataset.i;step=0;buzz();render()});$$('[data-w]').forEach(b=>b.onclick=()=>speak(s.w[+b.dataset.w][1]));$('#next')?.addEventListener('click',()=>{step++;buzz();render()});$('#back')?.addEventListener('click',()=>{step--;render()});$('#hear')?.addEventListener('click',()=>speak(s.u));$('#meaningBtn')?.addEventListener('click',()=>$('#meaning').textContent=s.m);$('#hearWrite')?.addEventListener('click',()=>speak(s.x));$('#finalHear')?.addEventListener('click',()=>speak(s.u));$('#again')?.addEventListener('click',()=>{step=0;render()});if(step===4)initCanvas();$('#trace')?.addEventListener('click',e=>{let t=$('#target');t.classList.toggle('hide');e.target.textContent=t.classList.contains('hide')?'見本を表示':'見本を隠す'});$('#clear')?.addEventListener('click',clearCanvas)}
function initCanvas(){let c=$('#canvas'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx=c.getContext('2d');ctx.scale(d,d);ctx.strokeStyle='#21312d';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';const pt=e=>{let q=c.getBoundingClientRect();return{x:e.clientX-q.left,y:e.clientY-q.top}};c.onpointerdown=e=>{drawing=true;last=pt(e);c.setPointerCapture(e.pointerId);buzz()};c.onpointermove=e=>{if(!drawing)return;let p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};c.onpointerup=()=>{drawing=false;last=null};c.onpointercancel=c.onpointerup}
function clearCanvas(){let c=$('#canvas');if(ctx)ctx.clearRect(0,0,c.width,c.height);buzz()}render();
</script></body></html>
