<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Arabic Living World</title><style>:root{--b:#f5f2ea;--p:#fffdf8;--i:#20302d;--m:#74807c;--l:#ded9ce;--a:#1f6f61}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand small{display:block;color:var(--m);font-size:11px}.btn{border:1px solid var(--l);background:#fff;border-radius:14px;padding:10px 13px;color:var(--i);text-decoration:none}.card{margin-top:16px;background:var(--p);border:1px solid var(--l);border-radius:28px;padding:24px 18px;min-height:520px;display:flex;flex-direction:column;justify-content:center}.count{text-align:center;color:var(--m);font-size:12px}.emoji{text-align:center;font-size:clamp(48px,14vw,78px);line-height:1.6;margin:20px 0}.feel{text-align:center;font-weight:750;font-size:18px}.ar{direction:rtl;text-align:center;font:clamp(34px,9vw,52px)/1.7 "Geeza Pro","Noto Naskh Arabic",serif;margin:20px 0;min-height:84px}.meaning{text-align:center;color:var(--m);min-height:44px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.pill{border:1px solid var(--l);background:#fff;border-radius:999px;padding:11px 15px;color:var(--i)}.primary{background:var(--a);color:#fff;border-color:var(--a)}.active{box-shadow:0 0 0 2px rgba(31,111,97,.15);border-color:var(--a)}.hint{margin-top:18px;text-align:center;color:var(--m);font-size:12px}.nav{display:flex;justify-content:space-between;margin-top:14px}.hidden{visibility:hidden}</style></head><body><div class="app"><div class="top"><div class="brand">Arabic Living World<small>Situation → Feeling → Sound → Arabic</small></div><a class="btn" href="./index.html">Structure Lab</a></div><main class="card"><div class="count" id="count"></div><div class="emoji" id="emoji"></div><div class="feel" id="feel"></div><div class="ar" id="ar"></div><div class="meaning" id="meaning"></div><div class="row"><button class="pill primary" id="hear">▶︎ 聞く</button><button class="pill" id="vowels">母音記号</button><button class="pill" id="show">意味</button><button class="pill" id="reset">状況だけ</button></div><div class="hint">状況を先にイメージします。母音記号は「母音記号」を押した時だけ表示します。</div></main><div class="nav"><button class="pill" id="prev">←</button><button class="pill primary" id="next">Continue →</button></div></div><script src="./a1-batch1.js"></script><script src="./a1-batch2.js"></script><script src="./a1-batch3.js"></script><script>
const B1=window.ARABIC_A1_BATCH1?.experiences||[],B2=window.ARABIC_A1_BATCH2?.experiences||[],B3=window.ARABIC_A1_BATCH3?.experiences||[];
function norm(e,n){if(e.languageEmergence)return {...e,number:e.number||n,ar:e.languageEmergence.utterance.ar,en:e.languageEmergence.utterance.en,ja:e.languageEmergence.utterance.ja,emoji:e.scene.mentalScene,feel:e.mind.emotionOrBodyState};return {...e,number:e.number||n,ar:e.language?.utterance||'',en:e.language?.meaning?.en||'',ja:e.language?.meaning?.ja||'',emoji:e.scene?.emoji||'',feel:e.scene?.feeling||''}}
const D=[...B1,...B2,...B3].map((e,k)=>norm(e,k+1));let i=+(localStorage.getItem('asl.a1.pos')||0),revealed=false,vocalized=false;const $=s=>document.querySelector(s);const strip=t=>(t||'').normalize('NFC').replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g,'');
function pulse(){try{if(navigator.vibrate)navigator.vibrate(18)}catch(e){}}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.78;u.onstart=pulse;u.onboundary=pulse;speechSynthesis.speak(u)}
function render(){if(!D.length){$('#emoji').textContent='📭';$('#feel').textContent='教材データを読み込めませんでした';return}i=Math.max(0,Math.min(i,D.length-1));localStorage.setItem('asl.a1.pos',i);const e=D[i];$('#count').textContent=`A1 · Experience ${e.number||i+1}/${D.length}`;$('#emoji').textContent=e.emoji;$('#feel').textContent=e.feel;$('#ar').textContent=revealed?(vocalized?e.ar:strip(e.ar)):'';$('#meaning').textContent='';$('#prev').classList.toggle('hidden',i===0);$('#vowels').classList.toggle('active',vocalized)}
$('#hear').onclick=()=>{revealed=true;render();speak(D[i].ar)};$('#vowels').onclick=()=>{vocalized=!vocalized;revealed=true;render()};$('#show').onclick=()=>{$('#meaning').textContent=`${D[i].en}  /  ${D[i].ja}`};$('#reset').onclick=()=>{revealed=false;vocalized=false;render()};$('#next').onclick=()=>{if(i<D.length-1)i++;revealed=false;vocalized=false;render()};$('#prev').onclick=()=>{if(i>0)i--;revealed=false;vocalized=false;render()};render();
</script></body></html>
