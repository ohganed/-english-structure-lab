<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Arabic Living World</title><style>:root{--b:#f5f2ea;--p:#fffdf8;--i:#20302d;--m:#74807c;--l:#ded9ce;--a:#1f6f61}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand small{display:block;color:var(--m);font-size:11px}.btn{border:1px solid var(--l);background:#fff;border-radius:14px;padding:10px 13px;color:var(--i);text-decoration:none}.card{margin-top:16px;background:var(--p);border:1px solid var(--l);border-radius:28px;padding:24px 18px;min-height:520px;display:flex;flex-direction:column;justify-content:center}.count{text-align:center;color:var(--m);font-size:12px}.emoji{text-align:center;font-size:clamp(48px,14vw,78px);line-height:1.6;margin:20px 0}.feel{text-align:center;font-weight:750;font-size:18px}.ar{direction:rtl;text-align:center;font:clamp(34px,9vw,52px)/1.7 "Geeza Pro","Noto Naskh Arabic",serif;margin:20px 0;min-height:84px}.meaning{text-align:center;min-height:56px}.meaning .en{font-size:17px;font-weight:700;color:var(--i)}.meaning .ja{font-size:12px;color:var(--m);margin-top:5px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.pill{border:1px solid var(--l);background:#fff;border-radius:999px;padding:11px 15px;color:var(--i)}.primary{background:var(--a);color:#fff;border-color:var(--a)}.active{box-shadow:0 0 0 2px rgba(31,111,97,.15);border-color:var(--a)}.hint{margin-top:18px;text-align:center;color:var(--m);font-size:12px}.hint .ja{display:block;font-size:11px;margin-top:3px}.nav{display:flex;justify-content:space-between;margin-top:14px}.hidden{visibility:hidden}.analysis{display:none;margin-top:14px;background:#fff;border:1px solid var(--l);border-radius:24px;padding:16px}.analysis.open{display:block}.analysisTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.analysisTitle{font-weight:800}.analysisTitle small{display:block;font-weight:400;color:var(--m);font-size:11px}.layerTabs{display:flex;gap:7px;overflow:auto;margin:13px 0 10px;padding-bottom:2px}.tab{white-space:nowrap;border:1px solid var(--l);background:#fff;border-radius:999px;padding:8px 11px}.tab.active{border-color:var(--a);background:#eef6f3}.analysisBody{line-height:1.65}.word{border-top:1px solid #eee7dc;padding:11px 0}.word:first-child{border-top:0}.wordAr{font:25px/1.5 "Geeza Pro","Noto Naskh Arabic",serif;direction:rtl;text-align:right}.micro{font-size:12px;color:var(--m)}.secondary{font-size:12px;color:var(--m);margin-top:2px}.chunk{padding:10px 0;border-top:1px solid #eee7dc}.chunkAr{font:22px/1.5 "Geeza Pro","Noto Naskh Arabic",serif;direction:rtl;text-align:right}.arch{background:#f7f5ef;border-radius:16px;padding:14px}.deep{margin-top:7px}.deep summary{cursor:pointer;color:var(--a);font-size:13px}.empty{text-align:center;color:var(--m);padding:18px 4px}</style></head><body><div class="app"><div class="top"><div class="brand">Arabic Living World<small>Situation → Feeling → Sound → Arabic</small></div><a class="btn" href="./index.html">Structure Lab</a></div><main class="card"><div class="count" id="count"></div><div class="emoji" id="emoji"></div><div class="feel" id="feel"></div><div class="ar" id="ar"></div><div class="meaning" id="meaning"></div><div class="row"><button class="pill primary" id="hear">▶︎ Listen</button><button class="pill" id="vowels">Vowels</button><button class="pill" id="show">Meaning</button><button class="pill" id="analyse">◌ Deep view</button><button class="pill" id="reset">Scene only</button></div><div class="hint">Imagine the situation first. Open analysis only when you want it.<span class="ja">まず状況をイメージし、必要な時だけ分析を開きます。</span></div></main><section class="analysis" id="analysis"><div class="analysisTop"><div class="analysisTitle">Structure under the surface<small>表面の下にある構造</small></div><button class="pill" id="closeAnalysis">Close</button></div><div class="layerTabs"><button class="tab active" data-layer="words">Words</button><button class="tab" data-layer="chunks">Chunks</button><button class="tab" data-layer="structure">Structure</button></div><div class="analysisBody" id="analysisBody"></div></section><div class="nav"><button class="pill" id="prev">←</button><button class="pill primary" id="next">Continue →</button></div></div><script src="./a1-batch1.js"></script><script src="./a1-batch2.js"></script><script src="./a1-batch3.js"></script><script src="./a1-analysis.js"></script><script>
const B1=window.ARABIC_A1_BATCH1?.experiences||[],B2=window.ARABIC_A1_BATCH2?.experiences||[],B3=window.ARABIC_A1_BATCH3?.experiences||[],A=window.ARABIC_A1_ANALYSIS?.items||{};
function norm(e,n){if(e.languageEmergence)return {...e,number:e.number||n,ar:e.languageEmergence.utterance.ar,en:e.languageEmergence.utterance.en,ja:e.languageEmergence.utterance.ja,emoji:e.scene.mentalScene,feel:e.mind.emotionOrBodyState};return {...e,number:e.number||n,ar:e.language?.utterance||'',en:e.language?.meaning?.en||'',ja:e.language?.meaning?.ja||'',emoji:e.scene?.emoji||'',feel:e.scene?.feeling||''}}
const D=[...B1,...B2,...B3].map((e,k)=>norm(e,k+1));let i=+(localStorage.getItem('asl.a1.pos')||0),revealed=false,vocalized=false,layer='words';const $=s=>document.querySelector(s);const strip=t=>(t||'').normalize('NFC').replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g,'');
function pulse(){try{if(navigator.vibrate)navigator.vibrate(18)}catch(e){}}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.78;u.onstart=pulse;u.onboundary=pulse;speechSynthesis.speak(u)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!D.length){$('#emoji').textContent='📭';$('#feel').textContent='Learning data could not be loaded.';return}i=Math.max(0,Math.min(i,D.length-1));localStorage.setItem('asl.a1.pos',i);const e=D[i];$('#count').textContent=`A1 · Experience ${e.number||i+1}/${D.length}`;$('#emoji').textContent=e.emoji;$('#feel').textContent=e.feel;$('#ar').textContent=revealed?(vocalized?e.ar:strip(e.ar)):'';$('#meaning').innerHTML='';$('#prev').classList.toggle('hidden',i===0);$('#vowels').classList.toggle('active',vocalized);if($('#analysis').classList.contains('open'))renderAnalysis()}
function renderAnalysis(){const e=D[i],a=A[e.id],b=$('#analysisBody');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.layer===layer));if(!a){b.innerHTML='<div class="empty">Deep analysis for this Experience is being expanded.<br><span class="micro">このExperienceの深層分析は現在拡張中です。</span></div>';return}if(layer==='words'){b.innerHTML=(a.words||[]).map(w=>`<div class="word"><div class="wordAr">${esc(w.surface)}</div><div><b>${esc(w.meaningEn||w.meaning||'')}</b>${w.meaningJa?`<div class="secondary">${esc(w.meaningJa)}</div>`:''}<div class="micro">${esc(w.pos||'')}</div></div><div class="micro">Lemma ${esc(w.lemma||'—')} · Root ${esc(w.root||'—')}</div><details class="deep"><summary>Morphology · إعراب · Word family</summary><div>${esc(w.morphEn||w.morph||'')}</div>${w.morphJa?`<div class="secondary">${esc(w.morphJa)}</div>`:''}<div><b>إعراب:</b> ${esc(w.irab||'')}</div>${w.family?.length?`<div><b>Word family:</b> ${w.family.map(esc).join(' · ')}</div>`:''}</details></div>`).join('')}else if(layer==='chunks'){b.innerHTML=(a.chunks||[]).map(c=>`<div class="chunk"><div class="chunkAr">${esc(c.text)}</div><div><b>Arabic order:</b> ${esc(c.orderEn||c.order||'')}</div>${c.orderJa?`<div class="secondary">${esc(c.orderJa)}</div>`:''}<div><b>Natural meaning:</b> ${esc(c.naturalEn||c.natural||'')}</div>${c.naturalJa?`<div class="secondary">${esc(c.naturalJa)}</div>`:''}<div class="micro">Function: ${esc(c.functionEn||c.function||'')}</div></div>`).join('')}else{b.innerHTML=`<div class="arch"><div><b>${esc(a.sentenceType?.en||a.sentenceType?.ar||'')}</b></div>${a.sentenceType?.ja?`<div class="secondary">${esc(a.sentenceType.ja)}</div>`:''}<p>${esc(a.architectureEn||a.architecture||'')}</p>${a.architectureJa?`<div class="secondary">${esc(a.architectureJa)}</div>`:''}</div>`}}
$('#hear').onclick=()=>{revealed=true;render();speak(D[i].ar)};$('#vowels').onclick=()=>{vocalized=!vocalized;revealed=true;render()};$('#show').onclick=()=>{$('#meaning').innerHTML=`<div class="en">${esc(D[i].en)}</div><div class="ja">${esc(D[i].ja)}</div>`};$('#analyse').onclick=()=>{$('#analysis').classList.add('open');revealed=true;render();renderAnalysis();setTimeout(()=>$('#analysis').scrollIntoView({behavior:'smooth',block:'nearest'}),30)};$('#closeAnalysis').onclick=()=>$('#analysis').classList.remove('open');document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{layer=t.dataset.layer;renderAnalysis()});$('#reset').onclick=()=>{revealed=false;vocalized=false;$('#analysis').classList.remove('open');render()};$('#next').onclick=()=>{if(i<D.length-1)i++;revealed=false;vocalized=false;$('#analysis').classList.remove('open');render()};$('#prev').onclick=()=>{if(i>0)i--;revealed=false;vocalized=false;$('#analysis').classList.remove('open');render()};render();
</script></body></html>
