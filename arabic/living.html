<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Arabic Living World</title><style>:root{--b:#f5f2ea;--p:#fffdf8;--i:#20302d;--m:#74807c;--l:#ded9ce;--a:#1f6f61}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand small{display:block;color:var(--m);font-size:11px}.btn{border:1px solid var(--l);background:#fff;border-radius:14px;padding:10px 13px;color:var(--i);text-decoration:none}.card{margin-top:16px;background:var(--p);border:1px solid var(--l);border-radius:28px;padding:24px 18px;min-height:520px;display:flex;flex-direction:column;justify-content:center}.count{text-align:center;color:var(--m);font-size:12px}.emoji{text-align:center;font-size:clamp(48px,14vw,78px);line-height:1.6;margin:20px 0}.feel{text-align:center;font-weight:750;font-size:18px}.ar{direction:rtl;text-align:center;font:clamp(34px,9vw,52px)/1.7 "Geeza Pro","Noto Naskh Arabic",serif;margin:20px 0}.meaning{text-align:center;color:var(--m);min-height:44px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.pill{border:1px solid var(--l);background:#fff;border-radius:999px;padding:11px 15px}.primary{background:var(--a);color:#fff;border-color:var(--a)}.hint{margin-top:18px;text-align:center;color:var(--m);font-size:12px}.nav{display:flex;justify-content:space-between;margin-top:14px}.hidden{visibility:hidden}</style></head><body><div class="app"><div class="top"><div class="brand">Arabic Living World<small>Situation → Feeling → Sound → Arabic</small></div><a class="btn" href="./index.html">Structure Lab</a></div><main class="card"><div class="count" id="count"></div><div class="emoji" id="emoji"></div><div class="feel" id="feel"></div><div class="ar" id="ar"></div><div class="meaning" id="meaning"></div><div class="row"><button class="pill primary" id="hear">▶︎ 聞く</button><button class="pill" id="show">意味</button><button class="pill" id="reset">状況だけ</button></div><div class="hint">まず状況をイメージしてから音を聞きます。母音記号の表示は教材側で勝手に切り替えません。</div></main><div class="nav"><button class="pill" id="prev">←</button><button class="pill primary" id="next">Continue →</button></div></div><script src="./a1-batch1.js"></script><script>const D=window.ARABIC_A1_BATCH1?.experiences||[];let i=+(localStorage.getItem('asl.a1.pos')||0),revealed=false;const $=s=>document.querySelector(s);function speak(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.8;speechSynthesis.speak(u)}function render(){if(!D.length){$('#emoji').textContent='📭';$('#feel').textContent='教材データを読み込めませんでした';return}i=Math.max(0,Math.min(i,D.length-1));localStorage.setItem('asl.a1.pos',i);const e=D[i],u=e.languageEmergence.utterance;$('#count').textContent=`A1 · Experience ${i+1}/${D.length}`;$('#emoji').textContent=e.scene.mentalScene;$('#feel').textContent=e.mind.emotionOrBodyState;$('#ar').textContent=revealed?u.ar:'';$('#meaning').textContent='';$('#prev').classList.toggle('hidden',i===0)}$('#hear').onclick=()=>{const e=D[i],u=e.languageEmergence.utterance;revealed=true;render();speak(u.ar)};$('#show').onclick=()=>{const u=D[i].languageEmergence.utterance;$('#meaning').textContent=`${u.en}  /  ${u.ja}`};$('#reset').onclick=()=>{revealed=false;render()};$('#next').onclick=()=>{if(i<D.length-1)i++;revealed=false;render()};$('#prev').onclick=()=>{if(i>0)i--;revealed=false;render()};render();</script></body></html>
